# Docker Compose for local development/testing
# Usage: docker-compose up -d

services:
  app:
    build: .
    container_name: tokeneye-app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@db:5432/tokenscout}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALERT_CHANNEL=${TELEGRAM_ALERT_CHANNEL}
      - TELEGRAM_PRO_ALERT_CHANNEL=${TELEGRAM_PRO_ALERT_CHANNEL}
      - HELIUS_API_KEY_1=${HELIUS_API_KEY_1}
      - HELIUS_API_KEY_2=${HELIUS_API_KEY_2}
      - HELIUS_API_KEY_3=${HELIUS_API_KEY_3}
      - HELIUS_API_KEY_4=${HELIUS_API_KEY_4}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tokeneye-network

  db:
    image: postgres:15-alpine
    container_name: tokeneye-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=tokenscout
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # Use 5433 to avoid conflict with local postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tokenscout"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tokeneye-network

volumes:
  postgres_data:

networks:
  tokeneye-network:
    driver: bridge
